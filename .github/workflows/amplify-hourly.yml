
name: Amplify Hourly Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: amplify-production
  cancel-in-progress: false

jobs:
  amplify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          cd bridge
          npm ci

      - name: Run discovery and research
        env:
          SURREAL_ENABLED: "true"
          SURREAL_DATABASE: main
          DISCOVERY_MODE: live_search
          YOUTUBE_ENABLED: "true"
          TREG_ENABLED: "true"
          MINDS_ENABLED: "true"
          OUTREACH_AUTOSEND_ENABLED: "false"
          GMAIL_REPLY_POLL_ENABLED: "false"

          SURREAL_URL: ${{ secrets.SURREAL_URL }}
          SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
          SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
          SURREAL_NAMESPACE: ${{ secrets.SURREAL_NAMESPACE }}

          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TREG_TOKEN: ${{ secrets.TREG_TOKEN }}
          TREG_INSTAGRAM_ENDPOINT: ${{ vars.TREG_INSTAGRAM_ENDPOINT }}

          MINDS_BUILDER_API_KEY: ${{ secrets.MINDS_BUILDER_API_KEY }}
          MINDS_RESEARCH_MIND_ID: ${{ secrets.MINDS_RESEARCH_MIND_ID }}

        run: python -m scripts.production_discovery_once
