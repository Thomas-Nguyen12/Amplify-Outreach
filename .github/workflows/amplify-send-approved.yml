
name: Amplify - Send Approved Customer Emails

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview approved emails without sending"
        required: true
        type: boolean
        default: true

  schedule:
    # Monday-Friday, 09:17 and 14:17 London time
    - cron: "17 9,14 * * 1-5"
      timezone: "Europe/London"

permissions:
  contents: read

concurrency:
  group: amplify-approved-customer-email
  cancel-in-progress: false

jobs:
  send-approved:
    name: Send Approved Customer Emails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: outreach-production

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

      # Outreach configuration
      OUTREACH_AUTOSEND_ENABLED: ${{ secrets.OUTREACH_AUTOSEND_ENABLED || 'false' }}
      HACKATHON_OUTREACH_PERMISSION_GRANTED: ${{ secrets.HACKATHON_OUTREACH_PERMISSION_GRANTED || 'false' }}
      HACKATHON_PERMISSION_REFERENCE: ${{ secrets.HACKATHON_PERMISSION_REFERENCE }}
      OUTREACH_EMAIL_CHANNEL_PERMITTED: ${{ secrets.OUTREACH_EMAIL_CHANNEL_PERMITTED || 'false' }}

      OUTREACH_PROVIDER: ${{ secrets.OUTREACH_PROVIDER || 'gmail' }}
      OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL }}
      OUTREACH_REPLY_TO: ${{ secrets.OUTREACH_REPLY_TO }}
      OUTREACH_SENDER_NAME: ${{ secrets.OUTREACH_SENDER_NAME }}
      OUTREACH_MAX_PER_DAY: ${{ secrets.OUTREACH_MAX_PER_DAY || '3' }}

      # SurrealDB Cloud
      SURREAL_ENABLED: "true"
      SURREAL_URL: ${{ secrets.SURREAL_URL }}
      SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
      SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
      SURREAL_NAMESPACE: ${{ secrets.SURREAL_NAMESPACE }}
      SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE || 'main' }}

      # Application credentials
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # Gmail credentials stored as raw JSON secrets
      GMAIL_OAUTH: ${{ secrets.GMAIL_OAUTH }}
      GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}

      # Official Amplify website
      AMPLIFY_SITE_URL: "https://amplify-social.replit.app/"

      # Scheduled runs are live; manual runs default to dry-run
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run && 'true' || 'false') }}

    steps:
      - name: Check outreach configuration
        id: gate
        shell: bash
        run: |
          if [[ "$OUTREACH_AUTOSEND_ENABLED" != "true" ]]; then
            echo "Outreach disabled. No emails will be sent."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$HACKATHON_OUTREACH_PERMISSION_GRANTED" != "true" ]]; then
            echo "Permission flag disabled."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$OUTREACH_EMAIL_CHANNEL_PERMITTED" != "true" ]]; then
            echo "Email channel not permitted."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$HACKATHON_PERMISSION_REFERENCE" ]]; then
            echo "Permission reference missing."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Configuration gate passed."
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt

      - name: Verify sender files
        if: steps.gate.outputs.run == 'true'
        run: |
          test -f scripts/send_approved_outreach.py
          test -f app/outreach.py
          test -f app/surreal_store.py
          python -m py_compile scripts/send_approved_outreach.py

      - name: Create temporary Gmail credentials
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          if [[ "$OUTREACH_PROVIDER" == "gmail" ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          credentials_dir = Path(
              os.environ["RUNNER_TEMP"]
          ) / "amplify-gmail"

          credentials_dir.mkdir(
              parents=True,
              exist_ok=True
          )
          credentials_dir.chmod(0o700)

          files = [
              ("GMAIL_OAUTH", "gmail_oauth.json"),
              ("GMAIL_TOKEN", "gmail_token.json"),
          ]

          github_env = Path(os.environ["GITHUB_ENV"])

          with github_env.open("a") as env_file:
              for secret_name, filename in files:
                  content = os.environ.get(
                      secret_name, ""
                  )

                  if not content.strip():
                      raise SystemExit(
                          f"Missing GitHub Secret: {secret_name}"
                      )

                  try:
                      parsed = json.loads(content)
                  except json.JSONDecodeError:
                      raise SystemExit(
                          f"{secret_name} must contain valid JSON"
                      )

                  if not isinstance(parsed, dict):
                      raise SystemExit(
                          f"{secret_name} must contain a JSON object"
                      )

                  path = credentials_dir / filename
                  path.write_text(content)
                  path.chmod(0o600)

                  env_var = (
                      "GMAIL_OAUTH_CLIENT_FILE"
                      if secret_name == "GMAIL_OAUTH"
                      else "GMAIL_TOKEN_FILE"
                  )

                  print(
                      f"{env_var}={path}",
                      file=env_file
                  )

          print("Gmail credential files prepared.")
          PY
          else
            echo "Provider does not require Gmail credentials."
          fi

      - name: Send approved customer emails
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY RUN requested."
          else
            echo "LIVE MODE: approved emails may be sent."
          fi

          python -m scripts.send_approved_outreach --limit 3

      - name: Report execution status
        if: always()
        shell: bash
        env:
          GATE_RESULT: ${{ steps.gate.outputs.run }}
        run: |
          if [[ "$GATE_RESULT" != "true" ]]; then
            echo "Sending skipped by configuration gate."
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry-run execution finished."
          else
            echo "Live sending execution finished."
          fi

          echo "Check sender logs for actual delivery counts."
